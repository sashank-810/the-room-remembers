<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#EDE7DC"/><title>The Room Remembers — The Palimpsest</title>
<style>
:root{--paper:#ede7dc;--ink:#344b43;--warm:#b57d5f;--light:#f7f2e9;--muted:#8b887f;--line:#bdb5a7;--floor:#e3ddce}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:1130px;padding:34px 24px 38px;margin:auto}header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(30px,4vw,44px);font-weight:600;line-height:1;margin:0;letter-spacing:-.055em}.period{color:#bc8061}.sub{font-size:10px;letter-spacing:.22em;font-weight:700;color:#ad7a60;margin-top:9px}.overline{color:#807a6f;letter-spacing:.13em;font-weight:700;font-size:10px;text-align:right;line-height:1.6}.stage{position:relative;background:#e4ddcf;border:1px solid #b9b5a6;box-shadow:0 14px 0 #d8d0c1,0 20px 35px #4b443721;border-radius:14px;overflow:hidden}.stage canvas{display:block;width:100%;aspect-ratio:880/560;touch-action:none}.panel{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:19px 1px 9px;font-size:12px;font-weight:600;letter-spacing:.05em}.panel .dim{color:#929086;font-weight:500}.chapter{font-size:11px;letter-spacing:.13em;color:#946e59}.controls{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:14px}.arrows{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:5px}.arrows button{border:1px solid #beb7a8;background:#f6f0e6;box-shadow:0 3px 0 #c5bdaf;border-radius:12px;color:#415a50;font-weight:800;font-size:20px;cursor:pointer;touch-action:manipulation}.arrows button:active,.arrows button.pressed{transform:translateY(2px);box-shadow:0 1px 0 #c5bdaf}.arrows button[data-step='U']{grid-column:2;grid-row:1}.arrows button[data-step='L']{grid-column:1;grid-row:2}.arrows button[data-step='D']{grid-column:2;grid-row:2}.arrows button[data-step='R']{grid-column:3;grid-row:2}.right{display:flex;gap:9px;align-items:flex-end}.act{font-weight:750;letter-spacing:.04em;border-radius:13px;padding:16px 20px;min-height:54px;border:1px solid #bdb5a7;background:#f8f2e9;color:#41574e;cursor:pointer;box-shadow:0 3px 0 #cfc7b7;touch-action:manipulation}.act.primary{background:#4d6e62;border-color:#42594f;color:#fffdf5;box-shadow:0 3px 0 #344a42}.act:active{transform:translateY(2px);box-shadow:none}.footer{display:flex;justify-content:space-between;color:#9e9688;font-size:11px;line-height:1.5;margin-top:20px}.kbd{display:inline-block;border:1px solid #cec5b6;padding:0 5px;border-radius:3px;font-weight:700}.peek{background:transparent;border:1px solid #bcb5a5;border-radius:7px;padding:5px 9px;font-size:10px;color:#7c6b60;letter-spacing:.1em;cursor:pointer}.muralmodal{position:absolute;inset:0;background:#27342dbc;align-items:center;justify-content:center;z-index:5;display:none}.muralmodal.open{display:flex}.muralpanel{padding:22px 27px 24px;background:#f4ede0;border:2px solid #bfa98b;border-radius:12px;text-align:center}.muralpanel h2{font-family:Georgia,serif;font-size:23px;margin:0 0 20px;color:#4b5f55}.muralgrid{display:grid;grid-template-columns:repeat(4,37px);gap:5px;justify-content:center;margin:0 auto 16px}.muralgrid span{display:block;width:37px;height:37px;border-radius:4px;border:2px solid #c6b6a2;background:#e7dccc}.muralgrid span.lit{background:#739383;border-color:#527a68}.muralpanel button{border:0;background:#486d5d;color:#fff;border-radius:7px;padding:10px 20px;cursor:pointer}.shade{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#26372ed1;padding:18px}.shade.open{display:flex}.modal{width:min(440px,90%);text-align:center;background:#f4ede1;color:#3c554b;border:2px solid #c5ad85;padding:28px 26px 26px;border-radius:13px;box-shadow:0 24px 50px #18281e6e}.modal small{font-weight:700;color:#ab7a60;letter-spacing:.22em}.modal h2{font-family:Georgia,serif;font-size:34px;line-height:1.1;margin:16px 0}.modal p{line-height:1.6;color:#868176;font-size:13px}.modal button{background:#476b5b;color:#fff9ed;border:none;border-radius:9px;padding:13px 23px;font-weight:700;cursor:pointer}.step-indicator{display:inline-flex;gap:4px;margin-left:12px}.step-indicator i{height:5px;width:5px;border-radius:50%;background:#c2b7a4;display:block}.step-indicator i.filled{background:#a67759}button:focus-visible{outline:3px solid #c98e60;outline-offset:2px}@media(max-width:670px){main{padding:16px 12px 27px}header{align-items:flex-start;margin-bottom:14px}h1{font-size:30px}.overline{font-size:8px;max-width:110px}.stage canvas{aspect-ratio:1.07}.panel{flex-wrap:wrap;padding-top:16px;font-size:11px}.arrows{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);gap:5px}.right{gap:6px}.act{padding:14px 12px;min-height:52px;font-size:11px}.footer span:first-child{display:none}.footer{justify-content:center}.stage{border-radius:10px}}
</style></head>
<body><main>
<header><div><h1>the room remembers<span class="period">.</span></h1><div class="sub">A STUDY IN THINGS UNDONE</div></div><div class="overline">THE HOUSE NOTICES<br/>AN UNFILED ROOM</div></header>
<div class="stage"><canvas id="game" width="880" height="560" aria-label="Top-down puzzle: move across the floor mosaic, replay a previous attempt, and reach the door when the room matches the mural"></canvas><div id="inspect" class="muralmodal"><div class="muralpanel"><h2>The Mural</h2><div class="muralgrid" id="magnifiedmural"></div><button id="closeinspect">Return to room</button></div></div><div id="victory" class="shade" role="dialog" aria-label="Room completed"><div class="modal"><small>THE ROOM LETS YOU THROUGH</small><h2>The Palimpsest</h2><p id="outcome">You left something behind.</p><button id="again">Try another history</button></div></div></div>
<div class="panel"><div><span class="chapter">07 / THE PALIMPSEST</span><span style="color:#bdb5a7;padding:0 8px">·</span><span id="attempt">Attempt 01</span></div><div><button class="peek" id="inspectbtn">INSPECT MURAL</button> <span id="trace" class="dim">No memory</span><span style="padding:0 6px;color:#c4bbae">·</span><span id="beats" class="dim">0 / 24 beats</span></div></div>
<div class="controls"><div class="arrows" aria-label="Movement controls"><button data-step="U" aria-label="Move up">▲</button><button data-step="L" aria-label="Move left">◀</button><button data-step="D" aria-label="Move down">▼</button><button data-step="R" aria-label="Move right">▶</button></div><div class="right"><button class="act" id="wait">WAIT</button><button class="act" id="restart" title="Clear all memories">RESET</button><button class="act primary" id="rewind">↺ REWIND</button></div></div>
<div class="footer"><span>Move: <span class="kbd">WASD</span> or arrows · <span class="kbd">Space</span> wait · <span class="kbd">R</span> rewind</span><span>Nothing is forgotten. Not quite.</span></div>
</main>
<script>/* THE PALIMPSEST: puzzle engine (pure, deterministic; testable in Node) */
(function(root){
'use strict';
const MAP_W=11,MAP_H=8, LIMIT=24, START={x:1,y:5}, EXIT={x:9,y:3};
const dirs={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0],'.':[0,0]};
const obstacles=new Set(['2,2','7,5','8,2','2,6']);
const eq=(a,b)=>a.x===b.x&&a.y===b.y;
function allowed(p){return p.x>=1&&p.x<=9&&p.y>=1&&p.y<=6&&!obstacles.has(p.x+','+p.y);}
function atTile(p){return p.x>=3&&p.x<=6&&p.y>=2&&p.y<=5;}
function tileIdx(p){return (p.y-2)*4+(p.x-3);}
function pulseAt(p){if(!atTile(p))return 0;let out=0;for(let [dx,dy] of [[0,0],[0,1],[0,-1],[1,0],[-1,0]]){const q={x:p.x+dx,y:p.y+dy};if(atTile(q))out^=(1<<tileIdx(q));}return out;}
function echoPulse(p){if(!atTile(p))return 0;let out=0;for(let [dx,dy] of [[-1,-1],[-1,1],[1,-1],[1,1]]){const q={x:p.x+dx,y:p.y+dy};if(atTile(q))out^=(1<<tileIdx(q));}return out;}
const steps=(p,ch)=>{let d=dirs[ch]||dirs['.'],q={x:p.x+d[0],y:p.y+d[1]};return allowed(q)?q:{...p};};
function imprint(actions,upto=LIMIT,pulse=pulseAt){let p={...START},mask=0;for(let t=0;t<Math.min(upto,actions.length);t++){let q=steps(p,actions[t]);if(!eq(p,q))mask^=pulse(q);p=q;}return {mask,p};}
const TARGET=28205; // solver-validated nontrivial target
function fresh(tape=null){return {p:{...START},echoP:{...START},turn:0,attempt:1,record:[],tape,mask:0,solved:false,history:[],event:'',drawEvents:[]};}
function step(s,a){if(s.solved||s.turn>=LIMIT||!(a in dirs))return s;const n={...s,p:{...s.p},echoP:{...s.echoP},record:s.record.slice(),drawEvents:[]};n.turn++;
 if(s.tape&&s.turn<s.tape.length){const prev=n.echoP,next=steps(prev,s.tape[s.turn]);if(!eq(prev,next)){n.mask^=echoPulse(next);if(atTile(next))n.drawEvents.push({type:'echo',x:next.x,y:next.y});}n.echoP=next;}
 const prev=n.p,next=steps(prev,a);if(!eq(prev,next)){n.mask^=pulseAt(next);if(atTile(next))n.drawEvents.push({type:'player',x:next.x,y:next.y});}n.p=next;n.record.push(a);
 n.solved=eq(n.p,EXIT)&&n.mask===TARGET;
 n.event=n.solved?'solved':s.mask!==n.mask?'changed':s.turn+1===LIMIT?'limit':'';
 return n;
}
function rewind(s){return {...fresh(s.record.length?s.record.slice():s.tape),attempt:s.attempt+1,history:s.history.concat([{turns:s.turn,match:16-popcount(s.mask^TARGET)}]),event:'rewound'};}
function reset(){return fresh();}
function popcount(n){let c=0;while(n){n&=n-1;c++;}return c;}
const api={MAP_W,MAP_H,LIMIT,START,EXIT,TARGET,dirs,allowed,atTile,tileIdx,pulseAt,steps,echoPulse,imprint,fresh,step,rewind,reset,popcount};
if(typeof module==='object'&&module.exports)module.exports=api;
root.PalimpsestEngine=api;
})(typeof window!=='undefined'?window:globalThis);
</script><script>(function(){'use strict';
const e=window.PalimpsestEngine,canvas=document.getElementById('game'),ctx=canvas.getContext('2d');if(!ctx)return;
let state=e.fresh(),activePulse=[],frame=0,mute=true,oldT=performance.now();const status={attempt:document.getElementById('attempt'),beats:document.getElementById('beats'),trace:document.getElementById('trace')};
const colors={room:'#EAE3D5',brick:'#788A7B',stone:'#CCD0C0',mosaic:'#E9E2D3',line:'#C8BEAE',lit:'#769486',amber:'#C2956D',ink:'#3E584F'};
const q=(x,y)=>{if(typeof x==='object'){y=x.y;x=x.x;}return {x:95+64*x,y:63+64*y};};
const rect=(x,y,w,h,fill,r=0)=>{ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();};
const line=(x,y,x2,y2,col,w=1)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();};
const circle=(x,y,r,fill)=>{ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();};
const label=(s,x,y,size=12,col='#6b786e',align='left',face='sans-serif')=>{ctx.fillStyle=col;ctx.font=`${size}px ${face}`;ctx.textAlign=align;ctx.fillText(s,x,y);};
function drawDoor(){const{x,y}=q(e.EXIT);rect(x+22,y-39,45,84,'#79614d',4);rect(x+26,y-35,37,76,'#ad8262',3);rect(x+31,y-29,27,30,'#D3A47A',2);rect(x+31,y+7,27,27,'#D3A47A',2);line(x+30,y+2,x+60,y+2,'#765a48',2);circle(x+54,y+5,3,'#ead4a1');rect(x+19,y+44,52,5,'#c6a886',2);if(state.mask===e.TARGET){rect(x+15,y-43,5,92,'#92B19A',2);circle(x+54,y+5,3,'#fce5a2');}else{rect(x+40,y+24,11,10,'#695a51',2);circle(x+45.5,y+28,2,'#d7c099');}}
function drawMural(){rect(738,153,114,195,'#D1C5B3',7);rect(745,159,101,184,'#f5eee2',5);label('THE MURAL',796,188,11,'#98765c','center');label('↔',795,210,16,'#a49c8d','center');const mx=751,my=224,sp=21;for(let j=0;j<4;j++)for(let i=0;i<4;i++){let idx=j*4+i,v=e.TARGET&(1<<idx);rect(mx+i*sp,my+j*sp,17,17,v?'#718e7f':'#e6ddd0',3);if(v)rect(mx+i*sp+4,my+j*sp+4,9,9,'#a1bbab',2);}label('THE FLOOR',796,322,10,'#8b8070','center');}
function drawBase(){rect(0,0,880,560,'#ebe5d8');rect(37,38,687,470,'#c0bbaa',8);rect(46,44,668,459,'#536f62',5);rect(59,58,641,428,'#eee7d9',3);rect(65,65,628,415,'#eee8dd',3);ctx.globalAlpha=.3;for(let y=91;y<467;y+=64)line(67,y,690,y,'#c7c0b0');for(let x=95;x<693;x+=64)line(x,68,x,475,'#c7c0b0');ctx.globalAlpha=1;for(let x of [176,370,560]){rect(x,45,80,12,'#af9479',3);rect(x+7,49,66,6,'#f0dec0',1);}for(let [x,y] of [[2,2],[7,5],[8,2],[2,6]]){const p=q({x,y});rect(p.x-27,p.y-28,54,56,'#b8a38c',7);rect(p.x-22,p.y-23,44,45,'#77877b',5);rect(p.x-17,p.y-18,34,35,'#90a294',5);circle(p.x-7,p.y-5,10,'#a9b7a0');circle(p.x+6,p.y+3,13,'#6c8777');}
// Four-by-four stone mosaic; the floor is the puzzle, rather than a control panel.
for(let j=0;j<4;j++)for(let i=0;i<4;i++){const p=q({x:i+3,y:j+2});const k=j*4+i,lit=!!(state.mask&(1<<k));rect(p.x-28,p.y-27,57,56,'#c2b5a3',4);rect(p.x-25,p.y-24,51,50,lit?'#789485':'#e4daca',3);if(lit){rect(p.x-18,p.y-17,37,36,'#8aa696',2);circle(p.x+17,p.y-16,2,'#d6e4d8');}else{rect(p.x-17,p.y-17,35,34,'#eee6d9',2);}line(p.x-13,p.y+14,p.x+13,p.y+14,lit?'#668674':'#d4c6b4',1);}
drawDoor();drawMural();
label('THE ARCHIVE',104,101,11,'#9f9180');label('·',184,102,12,'#c6b6a3');
// Thin stone marker indicating start, without arrow or answer text.
circle(q(e.START).x,q(e.START).y,24,'#a6b6a343');circle(q(e.START).x,q(e.START).y,19,'#b5c7b678');}
function character(pos,echo=false){if(!pos)return;const p=q(pos);if(echo){ctx.save();ctx.globalAlpha=.52;circle(p.x,p.y+12,15,'#886e6c');circle(p.x,p.y-12,10,'#AD8A85');rect(p.x-12,p.y-3,24,27,'#7B9697',7);rect(p.x-10,p.y+14,8,12,'#729191',3);rect(p.x+3,p.y+14,8,12,'#729191',3);ctx.restore();return;}circle(p.x,p.y+18,17,'#8c826c30');rect(p.x-11,p.y+9,9,15,'#41574e',3);rect(p.x+3,p.y+9,9,15,'#41574e',3);rect(p.x-13,p.y-8,26,29,'#b8745d',8);rect(p.x-8,p.y-7,16,18,'#55766a',6);circle(p.x,p.y-15,11,'#d7a581');ctx.fillStyle='#594c3f';ctx.beginPath();ctx.arc(p.x,p.y-19,11,Math.PI*1.05,Math.PI*1.94);ctx.lineTo(p.x+10,p.y-19);ctx.fill();circle(p.x+4,p.y-15,1.5,'#55483d');}
function pulseDraw(evt,age){let p=q(evt),fr=Math.min(age/550,1);const size=evt.type==='echo'?13:19;ctx.save();ctx.globalAlpha=(1-fr)*.75;circle(p.x,p.y,12+size*fr,evt.type==='echo'?'#B78872':'#66967B');if(evt.type==='echo'){for(let [dx,dy] of [[-1,-1],[1,-1],[-1,1],[1,1]])circle(p.x+dx*64,p.y+dy*64,4+(fr*6),'#9B7066');}else{for(let [dx,dy] of [[0,0],[-1,0],[1,0],[0,-1],[0,1]])circle(p.x+dx*64,p.y+dy*64,3+(fr*6),'#719B80');}ctx.restore();}
function draw(now){const bounds=canvas.getBoundingClientRect();let ww=bounds.width,hh=bounds.height,ratio=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(ww*Math.min(2,ratio)));canvas.height=Math.max(1,Math.round(hh*Math.min(2,ratio)));ctx.setTransform(canvas.width/ww,0,0,canvas.height/hh,0,0);const scale=Math.min(ww/880,hh/560);const ox=(ww-880*scale)*.5,oy=(hh-560*scale)*.5;ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);drawBase();activePulse=activePulse.filter(p=>now-p.t<560);for(let x of activePulse)pulseDraw(x,now-x.t);if(state.tape&&state.turn>0&&state.turn<=state.tape.length)character(state.echoP,true);character(state.p);ctx.restore();requestAnimationFrame(draw);}
function sync(){status.attempt.textContent='Attempt '+String(state.attempt).padStart(2,'0');status.beats.textContent=state.turn+' / '+e.LIMIT+' beats';status.trace.textContent=state.tape?'One memory':'No memory';document.getElementById('victory').classList.toggle('open',state.solved);if(state.solved)document.getElementById('outcome').textContent=`${state.attempt} attempt${state.attempt===1?'':'s'} · ${state.turn} beats on the final attempt. The floor remembers every step.`;}
function sound(){/* Deliberately silent for the first playtest. */}
function act(a){if(state.solved)return;const next=e.step(state,a);if(next===state)return;state=next;for(let ev of state.drawEvents)activePulse.push({...ev,t:performance.now()});sync();sound();}
function rewind(){state=e.rewind(state);activePulse=[];sync();}
function reset(){state=e.reset();activePulse=[];sync();}
const keys={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',W:'U',s:'D',S:'D',a:'L',A:'L',d:'R',D:'R',' ':' .' };
window.addEventListener('keydown',ev=>{let k=keys[ev.key];if(k){ev.preventDefault();if(!ev.repeat)act(k===' .'?'.':k);}else if(ev.key==='r'||ev.key==='R'){if(!ev.repeat)rewind();ev.preventDefault();}else if(ev.key==='Escape'){reset();}});
for(let b of document.querySelectorAll('[data-step]')){b.addEventListener('pointerdown',ev=>{ev.preventDefault();act(b.dataset.step);b.classList.add('pressed');});for(let n of ['pointerup','pointercancel','pointerleave'])b.addEventListener(n,()=>b.classList.remove('pressed'));}
const inspect=document.getElementById('inspect');const mural=document.getElementById('magnifiedmural');for(let i=0;i<16;i++){const el=document.createElement('span');if(e.TARGET&(1<<i))el.className='lit';mural.appendChild(el);}document.getElementById('inspectbtn').addEventListener('click',()=>inspect.classList.add('open'));document.getElementById('closeinspect').addEventListener('click',()=>inspect.classList.remove('open'));inspect.addEventListener('click',ev=>{if(ev.target===inspect)inspect.classList.remove('open')});
document.getElementById('wait').addEventListener('click',()=>act('.'));document.getElementById('rewind').addEventListener('click',rewind);document.getElementById('restart').addEventListener('click',reset);document.getElementById('again').addEventListener('click',reset);
window.__TRR_LAB__={get:()=>({...state,record:state.record.join(''),tape:state.tape?.join('')||null,match:16-e.popcount(state.mask^e.TARGET)}),step:act,rewind,reset,engine:e};sync();requestAnimationFrame(draw);
})();
</script>
</body></html>
